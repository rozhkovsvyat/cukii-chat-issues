name: Bug report
description: Something in Cukii Chat broke or misbehaved
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Fill out this form directly; no YouGile
        account or team invitation is required. Integrated GitHub reporting is
        being tested for Cukii 2.0.183. Issues and uploaded files are
        public: remove tokens, account details and private project information.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cukii Chat version
      description: Shown in VS Code Extensions → Cukii Chat (e.g. 2.0.183).
    validations:
      required: true
  - type: dropdown
    id: vendor
    attributes:
      label: Which agent was running?
      options:
        - Claude (Claude Code)
        - Codex / GPT
        - Kimi
        - Qwen / Alibaba
        - Grok
        - Cursor
        - Several / not sure
        - Not related to an agent run
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste reviewed diagnostic logs if available. Never include tokens, passwords or private conversations.
      render: text
